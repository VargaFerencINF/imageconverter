name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # a verziócímkéhez (v*) tartozó GitHub Release feltöltéséhez

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tesztek (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Qt rendszerkönyvtárak (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0

      - name: Függőségek
        run: python -m pip install -r requirements-build.txt

      - name: Pytest
        run: python -m pytest -q

  windows:
    name: Windows exe + telepítő
    needs: test
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Függőségek
        run: python -m pip install -r requirements-build.txt

      - name: Verzió
        id: ver
        shell: pwsh
        run: |
          $v = python -c "import webkep; print(webkep.__version__)"
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Verzió: $v"

      - name: PyInstaller build
        run: pyinstaller --noconfirm --clean packaging/webkep.spec

      - name: Füstpróba – parancssori exe
        shell: pwsh
        run: |
          .\dist\webkep-cli.exe --versions
          python -c "from PIL import Image; Image.linear_gradient('L').resize((640, 480)).convert('RGB').save('smoke.jpg'); Image.new('RGBA', (64, 64), (255, 0, 0, 128)).save('smoke.png')"
          .\dist\webkep-cli.exe smoke.jpg smoke.png -o smoke_out -f webp avif --long-edge 320
          if ($LASTEXITCODE -ne 0) { throw "a CLI hibakóddal lépett ki: $LASTEXITCODE" }
          foreach ($f in 'smoke.webp', 'smoke.avif') {
            if (-not (Test-Path "smoke_out\$f")) { throw "hiányzik: $f" }
          }
          Get-ChildItem smoke_out | Format-Table Name, Length

      - name: Füstpróba – grafikus exe (mappás és hordozható)
        shell: pwsh
        run: |
          foreach ($exe in 'dist\WebKepKonverter\WebKepKonverter.exe', 'dist\WebKepKonverter-Portable.exe') {
            $p = Start-Process $exe -PassThru
            Start-Sleep -Seconds 15
            if ($p.HasExited) { throw "$exe idő előtt kilépett (kód: $($p.ExitCode))" }
            Stop-Process -Id $p.Id -Force
            Write-Host "$exe elindult és fut"
          }

      - name: Inno Setup telepítő
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC hiba: $LASTEXITCODE" }

      - name: Fájlok összegyűjtése
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item "installer_output\WebKepKonverter-Setup-$v.exe" release\
          Copy-Item dist\WebKepKonverter-Portable.exe "release\WebKepKonverter-Portable-$v.exe"
          Copy-Item dist\webkep-cli.exe "release\webkep-cli-$v.exe"
          Get-ChildItem release | Format-Table Name, @{n='MB'; e={[math]::Round($_.Length / 1MB, 1)}}

      - name: Feltöltés (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: WebKepKonverter-${{ steps.ver.outputs.version }}-windows
          path: release/*
          if-no-files-found: error

      - name: GitHub Release (verziócímkénél)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
